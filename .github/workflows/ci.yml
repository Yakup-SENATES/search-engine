# Continuous integration workflow for the Search Engine Aggregator Service.
#
# Validates: operability-quick-wins Req 7.1, 7.2, 7.3.
#
# Two jobs:
#   * test       runs the unit, property, and ArchUnit tests via the Maven
#                wrapper on Temurin 21 (skips Testcontainers IT to keep
#                pipeline minutes low; full IT runs locally or in a
#                dedicated nightly workflow).
#   * image-scan builds the Docker image with the existing multi-stage
#                Dockerfile and runs Trivy against it. HIGH or CRITICAL
#                findings fail the workflow; the SARIF report is published
#                as an artifact for triage.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit + property + ArchUnit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run mvnw verify (skip Testcontainers IT)
        shell: bash
        run: ./mvnw -B -ntp verify -DskipITs

      - name: Upload Surefire reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t searchengine:ci .

      - name: Run Trivy vulnerability scan
        # Pinned by SHA so a tag rewrite cannot silently change CI behaviour
        # (operability-quick-wins Req 7.1, design.md Risk register).
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
        with:
          image-ref: searchengine:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          format: sarif
          output: trivy-report.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report.sarif
          path: trivy-report.sarif
          if-no-files-found: ignore
