<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Engine Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1d1d1f;
            margin: 0;
        }

        .page {
            padding: 2rem;
        }

        .topbar {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            padding: 1rem 2rem;
            background: #0f172a;
            color: #ffffff;
        }

        .topbar__brand {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .topbar__title {
            font-weight: 400;
            opacity: 0.85;
        }

        .notice {
            background: #fff8e1;
            border: 1px solid #f0c33c;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }

        .notice ul {
            margin: 0;
            padding-left: 1.25rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .controls__field {
            display: flex;
            flex-direction: column;
        }

        .controls__label {
            font-size: 0.85rem;
            color: #5f6368;
            margin-bottom: 0.25rem;
        }

        .controls__submit {
            padding: 0.4rem 0.9rem;
            background: #1d4ed8;
            color: #ffffff;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }

        .summary {
            color: #5f6368;
            margin: 0.5rem 0 1rem 0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #f7f7f9;
            font-weight: 600;
            text-align: left;
            padding: 0;
            border-bottom: 1px solid #e6e6e6;
            z-index: 1;
        }

        tbody td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #e6e6e6;
        }

        tbody tr:nth-child(even) {
            background: #fafafa;
        }

        tbody tr:hover {
            background: #eef2ff;
        }

        td.score, th.score-col {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ---- sortable headers --------------------------------------------- */

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable .sort-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: 0;
            font: inherit;
            color: inherit;
            text-align: inherit;
            cursor: pointer;
        }

        th.sortable.score-col .sort-btn {
            justify-content: flex-end;
            flex-direction: row-reverse; /* arrows on the left of the label for right-aligned column */
        }

        th.sortable .sort-btn:hover {
            color: #1d4ed8;
        }

        th.sortable .sort-btn:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: -2px;
        }

        /* Stacked up + down triangle indicator. Both arrows are dim by
           default; the active direction lights up to #1d4ed8. */
        .sort-icon {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 0.7rem;
            line-height: 0.55;
            font-size: 0.6rem;
            color: #b0b3b8;
            flex: none;
        }

        .sort-icon::before {
            content: "▲";
        }

        .sort-icon::after {
            content: "▼";
        }

        th.sortable[aria-sort="ascending"] .sort-icon::before {
            color: #1d4ed8;
        }

        th.sortable[aria-sort="descending"] .sort-icon::after {
            color: #1d4ed8;
        }

        th.sortable[aria-sort="ascending"],
        th.sortable[aria-sort="descending"] {
            color: #1d4ed8;
        }

        /* -------------------------------------------------------------------- */

        .type-badge {
            display: inline-block;
            padding: 0.1rem 0.55rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.02em;
        }

        .type-badge--text {
            background: #1d4ed8;
        }

        .type-badge--video {
            background: #6d28d9;
        }

        .empty {
            margin-top: 1rem;
            color: #5f6368;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .page {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls__field, .controls__submit {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header class="topbar">
    <span class="topbar__brand">Search Engine</span>
    <span class="topbar__title">Dashboard</span>
</header>

<main class="page">

    <!--
        Visible "ignored" notice — REQ 10.5, 10.7. Rendered only when the
        controller flagged the user-supplied sort or type as invalid.
    -->
    <div class="notice" th:if="${notice.hasMessages()}" role="status" data-testid="ignored-notice">
        <strong>Some parameters were ignored:</strong>
        <ul>
            <li th:each="message : ${notice.messages()}" th:text="${message}">Ignored ...</li>
        </ul>
    </div>

    <form class="controls" method="get" action="/dashboard">
        <label class="controls__field">
            <span class="controls__label">Top 20 by</span>
            <select name="sort">
                <option value="score"      th:selected="${activeSort == 'score'}">Score</option>
                <option value="popularity" th:selected="${activeSort == 'popularity'}">Popularity</option>
                <option value="relevance"  th:selected="${activeSort == 'relevance'}">Relevance</option>
            </select>
        </label>
        <label class="controls__field">
            <span class="controls__label">Type</span>
            <select name="type">
                <option value=""      th:selected="${activeType == null}">All</option>
                <option value="text"  th:selected="${activeType == 'text'}">Text</option>
                <option value="video" th:selected="${activeType == 'video'}">Video</option>
            </select>
        </label>
        <button class="controls__submit" type="submit">Apply</button>
    </form>

    <p class="summary" data-testid="result-count">
        Showing
        <span th:text="${#lists.size(rows)}">0</span>
        <span th:if="${activeType != null}" th:text="${activeType + ' '}"></span>results
        sorted by
        <span th:text="${activeSort}">score</span>
        <span class="summary__hint"> &middot; click any column header to re-sort</span>
    </p>

    <!--
        Always render the table headers so REQ 10.8 can satisfy "render the
        table headers and display a visible message" when no rows match.

        Each header is a sortable column with up/down arrow indicators.
        Sorting is performed client-side on the already-loaded rows, so a
        click does not trigger a server round-trip. The Score column starts
        in the "descending" state to match the server-side default ordering.
    -->
    <div class="table-wrap">
        <table data-testid="dashboard-table">
            <thead>
            <tr>
                <th scope="col"
                    class="sortable"
                    data-sort-key="title"
                    data-sort-type="text"
                    aria-sort="none">
                    <button type="button" class="sort-btn" aria-label="Sort by title">
                        <span>Title</span>
                        <span class="sort-icon" aria-hidden="true"></span>
                    </button>
                </th>
                <th scope="col"
                    class="sortable"
                    data-sort-key="type"
                    data-sort-type="text"
                    aria-sort="none">
                    <button type="button" class="sort-btn" aria-label="Sort by type">
                        <span>Type</span>
                        <span class="sort-icon" aria-hidden="true"></span>
                    </button>
                </th>
                <th scope="col"
                    class="sortable score-col"
                    data-sort-key="score"
                    data-sort-type="number"
                    aria-sort="descending">
                    <button type="button" class="sort-btn" aria-label="Sort by score">
                        <span>Score</span>
                        <span class="sort-icon" aria-hidden="true"></span>
                    </button>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}" th:unless="${empty}">
                <td th:text="${row.title()}"
                    th:attr="data-value=${row.title()}">Title</td>
                <td th:attr="data-value=${row.type()}">
                    <span th:class="'type-badge type-badge--' + ${row.type()}"
                          th:text="${row.type()}">type</span>
                </td>
                <td class="score"
                    th:attr="data-value=${row.score()}"
                    th:text="${#numbers.formatDecimal(row.score(), 1, 1)}">0.0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty-state message — REQ 10.8 -->
    <p class="empty" th:if="${empty}" data-testid="empty-message">
        No content items are available.
    </p>

</main>

<script>
    // ---------------------------------------------------------------------
    // Client-side column sorting for the dashboard table.
    //
    // - Each sortable <th> carries data-sort-key (cell column id) and
    //   data-sort-type ("text" or "number").
    // - Each <td> carries a data-value attribute holding the raw value to
    //   compare against (numeric for score, plain text otherwise) so we
    //   never depend on how the cell was rendered.
    // - Clicking a header toggles its direction (asc <-> desc) when it is
    //   already active, otherwise resets to a sensible default for that
    //   column type (numbers default to descending; text to ascending).
    // - The active column reflects its state via aria-sort so screen
    //   readers and the CSS arrow indicator stay in sync.
    // ---------------------------------------------------------------------
    (function () {
        const table = document.querySelector('[data-testid="dashboard-table"]');
        if (!table) return;

        const tbody = table.querySelector('tbody');
        if (!tbody) return;

        const headers = Array.from(table.querySelectorAll('th.sortable'));
        if (headers.length === 0) return;

        function sortRows(colIndex, type, direction) {
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const factor = direction === 'asc' ? 1 : -1;

            rows.sort(function (a, b) {
                const aCell = a.children[colIndex];
                const bCell = b.children[colIndex];
                const rawA = aCell ? (aCell.dataset.value ?? aCell.textContent ?? '') : '';
                const rawB = bCell ? (bCell.dataset.value ?? bCell.textContent ?? '') : '';

                if (type === 'number') {
                    const numA = parseFloat(rawA);
                    const numB = parseFloat(rawB);
                    const safeA = isNaN(numA) ? 0 : numA;
                    const safeB = isNaN(numB) ? 0 : numB;
                    return (safeA - safeB) * factor;
                }
                return String(rawA).localeCompare(String(rawB), undefined, { sensitivity: 'base' }) * factor;
            });

            const fragment = document.createDocumentFragment();
            rows.forEach(function (row) { fragment.appendChild(row); });
            tbody.appendChild(fragment);
        }

        function handleHeaderClick(header) {
            const colIndex = headers.indexOf(header);
            const type = header.dataset.sortType || 'text';
            const current = header.getAttribute('aria-sort');

            let nextDir;
            if (current === 'ascending') {
                nextDir = 'desc';
            } else if (current === 'descending') {
                nextDir = 'asc';
            } else {
                nextDir = type === 'number' ? 'desc' : 'asc';
            }

            // Reset all headers, then mark the clicked one.
            headers.forEach(function (h) {
                h.setAttribute('aria-sort', 'none');
            });
            header.setAttribute('aria-sort', nextDir === 'asc' ? 'ascending' : 'descending');

            sortRows(colIndex, type, nextDir);
        }

        headers.forEach(function (header) {
            const button = header.querySelector('.sort-btn') || header;
            button.addEventListener('click', function () { handleHeaderClick(header); });
        });
    })();
</script>

</body>
</html>
